<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Failed</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins', sans-serif;
        }

        body{
            background: linear-gradient(to right, #ff9a9e, #fad0c4);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .failed-card{
            background:white;
            width:100%;
            max-width:500px;
            padding:50px;
            border-radius:25px;
            text-align:center;
            box-shadow:0 10px 30px rgba(0,0,0,0.2);
            animation: shake 0.5s ease;
        }

        @keyframes shake{

            0%{
                transform:translateX(-10px);
            }

            25%{
                transform:translateX(10px);
            }

            50%{
                transform:translateX(-10px);
            }

            75%{
                transform:translateX(10px);
            }

            100%{
                transform:translateX(0);
            }

        }

        .failed-icon{
            font-size:90px;
            color:red;
            margin-bottom:20px;
        }

        .failed-title{
            font-size:38px;
            font-weight:700;
            color:red;
        }

        .failed-text{
            font-size:18px;
            color:#555;
            margin-top:15px;
            margin-bottom:30px;
        }

        .btn-retry{
            background:red;
            color:white;
            padding:12px 30px;
            border:none;
            border-radius:30px;
            text-decoration:none;
            font-size:18px;
            font-weight:600;
            transition:0.3s;
        }

        .btn-retry:hover{
            background:darkred;
            color:white;
        }

    </style>

</head>
<body>

    <div class="failed-card">

        <!-- Failed Icon -->

        <div class="failed-icon">
            ❌
        </div>

        <!-- Title -->

        <h1 class="failed-title">
            Payment Failed
        </h1>

        <!-- Message -->

        <p class="failed-text">

            Oops! Your payment could not be completed.
            Please try again.

        </p>

        <!-- Retry Button -->

        <a href="/" class="btn-retry">

            Try Again

        </a>

    </div>

    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
