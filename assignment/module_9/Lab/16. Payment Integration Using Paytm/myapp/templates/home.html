<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Doctor Finder</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: 'Poppins', sans-serif;
        }

        body{
            background: linear-gradient(to right, #e3f2fd, #ffffff);
            min-height:100vh;
        }

        .navbar{
            background:#0d6efd;
            padding:15px;
        }

        .navbar-brand{
            color:white !important;
            font-size:28px;
            font-weight:700;
        }

        .hero-section{
            text-align:center;
            padding:60px 20px;
        }

        .hero-section h1{
            font-size:50px;
            font-weight:700;
            color:#0d6efd;
        }

        .hero-section p{
            font-size:18px;
            color:#555;
            margin-top:10px;
        }

        .doctor-card{
            border:none;
            border-radius:20px;
            overflow:hidden;
            transition:0.4s;
            box-shadow:0 5px 20px rgba(0,0,0,0.1);
            background:white;
        }

        .doctor-card:hover{
            transform:translateY(-10px);
            box-shadow:0 10px 30px rgba(0,0,0,0.2);
        }

        .doctor-img{
            height:250px;
            object-fit:cover;
        }

        .specialty{
            color:#0d6efd;
            font-weight:600;
        }

        .fees{
            font-size:20px;
            font-weight:700;
            color:green;
        }

        .btn-book{
            background:#0d6efd;
            color:white;
            border:none;
            border-radius:30px;
            padding:10px 20px;
            transition:0.3s;
        }

        .btn-book:hover{
            background:#084298;
            color:white;
        }

        footer{
            background:#0d6efd;
            color:white;
            text-align:center;
            padding:15px;
            margin-top:50px;
        }

    </style>
</head>
<body>

    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg">
        <div class="container">

            <a class="navbar-brand" href="#">
                🩺 Doctor Finder
            </a>

        </div>
    </nav>

    <!-- Hero Section -->

    <section class="hero-section">

        <div class="container">

            <h1>Find Best Doctors</h1>

            <p>
                Book appointments with experienced doctors easily
            </p>

        </div>

    </section>

    <!-- Doctors Section -->

    <div class="container">

        <div class="row g-4">

            {% for doctor in doctors %}

            <div class="col-md-4">

                <div class="card doctor-card">

                    <!-- Doctor Image -->

                    <img 
                        src="https://images.unsplash.com/photo-1612349317150-e413f6a5b16d?q=80&w=1000&auto=format&fit=crop"
                        class="card-img-top doctor-img"
                        alt="Doctor Image"
                    >

                    <div class="card-body text-center">

                        <h3 class="card-title">
                            {{ doctor.name }}
                        </h3>

                        <p class="specialty">
                            {{ doctor.specialty }}
                        </p>

                        <p class="fees">
                            ₹{{ doctor.fees }}
                        </p>

                        <a href="/payment/{{ doctor.id }}/"
                           class="btn btn-book">
                            Book Appointment
                        </a>

                    </div>

                </div>

            </div>

            {% endfor %}

        </div>

    </div>

    <!-- Footer -->

    <footer>

        <h5>
            © 2026 Doctor Finder | All Rights Reserved
        </h5>

    </footer>

    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
