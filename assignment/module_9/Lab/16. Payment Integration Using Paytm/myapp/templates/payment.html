<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paytm Payment</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins', sans-serif;
        }

        body{
            background: linear-gradient(to right, #dbeafe, #ffffff);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .payment-card{
            width:100%;
            max-width:500px;
            background:white;
            border-radius:20px;
            overflow:hidden;
            box-shadow:0 10px 30px rgba(0,0,0,0.1);
        }

        .payment-header{
            background:#00baf2;
            color:white;
            text-align:center;
            padding:25px;
        }

        .payment-header h1{
            font-size:32px;
            font-weight:700;
        }

        .doctor-info{
            padding:30px;
        }

        .doctor-name{
            font-size:28px;
            font-weight:600;
            color:#0d6efd;
        }

        .fees{
            font-size:24px;
            font-weight:700;
            color:green;
            margin-bottom:20px;
        }

        .form-control{
            height:50px;
            border-radius:10px;
        }

        .btn-pay{
            width:100%;
            height:50px;
            border:none;
            border-radius:10px;
            background:#00baf2;
            color:white;
            font-size:18px;
            font-weight:600;
            transition:0.3s;
        }

        .btn-pay:hover{
            background:#0095c8;
        }

        .secure-text{
            text-align:center;
            margin-top:15px;
            color:#777;
            font-size:14px;
        }

        .payment-icon{
            font-size:60px;
        }

    </style>

</head>
<body>

    <div class="payment-card">

        <!-- Header -->

        <div class="payment-header">

            <div class="payment-icon">
                💳
            </div>

            <h1>Paytm Payment</h1>

        </div>

        <!-- Doctor Info -->

        <div class="doctor-info">

            <h2 class="doctor-name">
                {{ doctor.name }}
            </h2>

            <p class="text-muted">
                Specialist : {{ doctor.specialty }}
            </p>

            <p class="fees">
                Consultation Fees : ₹{{ doctor.fees }}
            </p>

            <!-- Payment Form -->

            <form method="POST">

                {% csrf_token %}

                <div class="mb-3">

                    <label class="form-label">
                        Patient Name
                    </label>

                    <input 
                        type="text"
                        name="name"
                        class="form-control"
                        placeholder="Enter Your Name"
                        required
                    >

                </div>

                <button type="submit" class="btn-pay">
                    Pay Now
                </button>

            </form>

            <p class="secure-text">
                🔒 100% Secure Payment via Paytm
            </p>

        </div>

    </div>

    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
