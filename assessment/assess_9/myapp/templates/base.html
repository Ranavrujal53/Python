<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Social Profile Web App{% endblock %}</title>

    <!-- FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- ICONS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>

        /* =========================
           🎨 GREEN DESIGN SYSTEM
        ========================= */

        :root {

            /* 🌿 BACKGROUND */
            --bg-main: #AFF26B;

            /* soft layering */
            --bg-soft: #eaffc7;
            --bg-light: #f4ffe0;

            /* 🧊 GLASS */
            --glass: rgba(255, 255, 255, 0.75);
            --border: rgba(112, 201, 14, 0.25);

            /* 🎯 PRIMARY GREEN */
            --primary: #70C90E;
            --secondary: #4ade80;

            /* 📝 TEXT */
            --text: #0f172a;
            --muted: #64748b;
        }

        /* =========================
           🌤 BACKGROUND
        ========================= */

        body {
            font-family: 'Inter', sans-serif;
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;

            background:
                radial-gradient(circle at top left, rgba(112,201,14,0.25), transparent 45%),
                radial-gradient(circle at bottom right, rgba(175,242,107,0.35), transparent 50%),
                linear-gradient(135deg, var(--bg-main), var(--bg-light));
        }

        /* =========================
           🌐 NAVBAR
        ========================= */

        .navbar {
            background: rgba(255,255,255,0.70) !important;
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
        }

        .navbar-brand {
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), #4ade80);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-link {
            color: var(--muted) !important;
            font-weight: 500;
        }

        .nav-link:hover {
            color: var(--primary) !important;
        }

        /* =========================
           🧊 GLASS CARD
        ========================= */

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(18px);
            border: 1px solid var(--border);
            border-radius: 18px;

            box-shadow: 0 10px 25px rgba(112, 201, 14, 0.12);
            transition: all 0.25s ease;
        }

        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 18px 40px rgba(112, 201, 14, 0.20);
        }

        /* =========================
           🔵 BUTTONS
        ========================= */

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #4ade80);
            border: none;
            border-radius: 12px;
            font-weight: 700;

            box-shadow: 0 0 18px rgba(112, 201, 14, 0.35);
        }

        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 0 28px rgba(112, 201, 14, 0.55);
        }

        .btn-outline-secondary {
            border-radius: 12px;
            border: 1px solid rgba(112, 201, 14, 0.25);
        }

        /* =========================
           👤 AVATAR
        ========================= */

        .profile-avatar {
            width: 48px;
            height: 48px;
            border-radius: 14px;

            background: linear-gradient(135deg, var(--primary), #4ade80);

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;
            font-weight: 700;

            box-shadow: 0 0 18px rgba(112, 201, 14, 0.35);
        }

        /* =========================
           ✨ ANIMATION
        ========================= */

        .animate-fade-in {
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================
           📜 SCROLLBAR
        ========================= */

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(var(--primary), #4ade80);
            border-radius: 10px;
        }

        /* =========================
           🦶 FOOTER
        ========================= */

        .footer {
            text-align: center;
            padding: 30px;
            font-size: 0.85rem;
            color: var(--muted);
        }

        main {
            min-height: 80vh;
        }

    </style>

</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg sticky-top">

    <div class="container">

        <a class="navbar-brand" href="{% url 'list_profiles' %}">
           <i class="bi bi-flower1 me-1"></i> EcoSocial
        </a>

        <button class="navbar-toggler border-0" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse">

            <ul class="navbar-nav ms-auto align-items-center gap-2">

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'list_profiles' %}">Discover</a>
                </li>

                <li class="nav-item">
                    <a href="{% url 'export_csv' %}" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-download me-1"></i> Export
                    </a>
                </li>

                <li class="nav-item">
                    <a href="{% url 'create_profile' %}" class="btn btn-primary btn-sm px-3">
                        + Create
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>

<!-- MAIN -->
<main class="container py-5 animate-fade-in">
    {% block content %}{% endblock %}
</main>

<!-- FOOTER -->
<footer class="footer">
    <div class="container">
        © 2026 SocialHub • Green UI Edition
    </div>
</footer>

<!-- BOOTSTRAP -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
