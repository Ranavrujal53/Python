<!DOCTYPE html>
<html>
<head>
    <title>Home</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1a2328, #2b3a42);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: #ffffff;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            width: 400px;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.2);
        }

        h1 {
            margin-bottom: 10px;
        }

        .welcome {
            font-size: 16px;
            margin-bottom: 20px;
            color: #555;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .login {
            background: #007bff;
            color: white;
        }

        .login:hover {
            background: #0056b3;
        }

        .register {
            background: #28a745;
            color: white;
        }

        .register:hover {
            background: #1e7e34;
        }

        .logout {
            background: #dc3545;
            color: white;
        }

        .logout:hover {
            background: #a71d2a;
        }

        a {
            text-decoration: none;
        }
    </style>

</head>
<body>

    <div class="container">
        <h1>Welcome to My Website</h1>

        <div class="welcome">
            Welcome {{user}}
        </div>

        <p>Please choose an option:</p>

        <a href="{% url 'loginpage' %}">
            <button class="btn login">Login</button>
        </a>

        <a href="{% url 'reg' %}">
            <button class="btn register">Register</button>
        </a>

        <a href="{% url 'logout' %}">
            <button class="btn logout">Logout</button>
        </a>
    </div>

</body>
</html>
