<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student</title>

    <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Poppins', sans-serif;
    }

    body {
        background: #0f172a;
        color: #fff;
        padding: 20px;
    }

    h1 {
        text-align: center;
        margin-bottom: 25px;
        font-size: 32px;
        letter-spacing: 1px;
    }

    /* Glass Form */
    form {
        max-width: 420px;
        margin: auto;
        padding: 25px;
        border-radius: 15px;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(12px);
        box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        border: 1px solid rgba(255,255,255,0.1);
    }

    form label {
        font-size: 14px;
        display: block;
        margin-bottom: 5px;
        color: #cbd5f5;
    }

    form input {
        width: 100%;
        padding: 10px;
        margin-bottom: 15px;
        border-radius: 8px;
        border: none;
        outline: none;
        background: rgba(255,255,255,0.1);
        color: #fff;
        transition: 0.3s;
    }

    form input:focus {
        background: rgba(255,255,255,0.2);
        box-shadow: 0 0 10px #38bdf8;
    }

    form input::placeholder {
        color: #aaa;
    }

    form input[type="submit"] {
        background: linear-gradient(45deg, #38bdf8, #6366f1);
        cursor: pointer;
        font-weight: bold;
        letter-spacing: 1px;
        transition: 0.3s;
    }

    form input[type="submit"]:hover {
        transform: scale(1.05);
        box-shadow: 0 0 15px #38bdf8;
    }

    /* Message */
    .message {
        max-width: 420px;
        margin: 10px auto;
        padding: 10px;
        text-align: center;
        border-radius: 8px;
        background: rgba(34,197,94,0.2);
        color: #4ade80;
    }

    /* Table */
    table {
        width: 95%;
        margin: 30px auto;
        border-collapse: collapse;
        border-radius: 12px;
        overflow: hidden;
        background: rgba(255,255,255,0.05);
        backdrop-filter: blur(10px);
    }

    table th {
        background: rgba(99,102,241,0.6);
        padding: 12px;
        text-transform: uppercase;
        font-size: 14px;
    }

    table td {
        padding: 10px;
        text-align: center;
        border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    table tr:hover {
        background: rgba(255,255,255,0.08);
    }

    /* Buttons */
    a {
        padding: 6px 12px;
        border-radius: 6px;
        text-decoration: none;
        color: white;
        font-size: 13px;
        transition: 0.3s;
    }

    a[href*="delete"] {
        background: linear-gradient(45deg, #ef4444, #b91c1c);
    }

    a[href*="delete"]:hover {
        box-shadow: 0 0 10px #ef4444;
    }

    a[href*="update"] {
        background: linear-gradient(45deg, #22c55e, #15803d);
    }

    a[href*="update"]:hover {
        box-shadow: 0 0 10px #22c55e;
    }

    /* Responsive */
    @media(max-width: 600px) {
        form {
            width: 95%;
        }

        table {
            font-size: 12px;
        }
    }
</style>
</head>
<body>

    <h1>Student Form</h1>

    {% for message in messages %}
        <div class="message">{{message}}</div>
    {% endfor %}

    <form action="" method="post">
        {% csrf_token %}
        <input type="hidden" name="id" value="{{stud.id}}">

        <label>Name</label>
        <input type="text" name="name" placeholder="Enter the name" value="{{stud.name}}">

        <label>Email</label>
        <input type="email" name="email" placeholder="Enter the email" value="{{stud.email}}">

        <label>Age</label>
        <input type="number" name="age" placeholder="Enter the age" value="{{stud.age}}">

        <input type="submit" value="Submit">
    </form>

    <table cellspacing="10" cellpadding="10">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Age</th>
            <th colspan="2">Action</th>
        </tr>

        {% for i in std %}
        <tr>
            <td>{{i.id}}</td>
            <td>{{i.name}}</td>
            <td>{{i.email}}</td>
            <td>{{i.age}}</td>
            <td><a href="{% url 'delete' %}?
                ={{ i.id }}">Delete</a></td>
            <td><a href="{% url 'update' %}?uid={{ i.id }}">Update</a></td>
        </tr>
        {% endfor %}
    </table>

</body>
</html>
