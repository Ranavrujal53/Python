<h1>Student List</h1>

<table border="1">
<tr>
    <th>Name</th>
    <th>Email</th>
    <th>Age</th>
    <th>Action</th>
</tr>

{% for i in data %}
<tr>
    <td>{{ i.name }}</td>
    <td>{{ i.email }}</td>
    <td>{{ i.age }}</td>
    <td>
        <a href="{% url 'edit' i.id %}">Edit</a> |
        <a href="{% url 'delete' i.id %}">Delete</a>
    </td>
</tr>
{% endfor %}

</table>

<a href="{% url 'index' %}">Add New</a>
