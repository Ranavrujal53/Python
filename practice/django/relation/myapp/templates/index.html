<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Form</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <style>
        body {
            background: linear-gradient(135deg, #1a2328, #2b3a42);
            font-family: 'Segoe UI', sans-serif;
            color: #fff;
        }

        .card {
            border-radius: 15px;
            background: #ffffff;
            color: #000;
        }

        h4 {
            font-weight: bold;
            letter-spacing: 1px;
        }

        .form-control, select {
            border-radius: 10px;
            padding: 10px;
            border: 1px solid #ccc;
            transition: 0.3s;
        }

        .form-control:focus, select:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 8px rgba(13, 110, 253, 0.4);
        }

        label {
            font-weight: 500;
            margin-bottom: 5px;
        }

        .btn-primary {
            border-radius: 10px;
            padding: 10px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-primary:hover {
            background: #0b5ed7;
            transform: scale(1.03);
        }

        table {
            margin-top: 25px;
            width: 100%;
            border-collapse: collapse;
            border-radius: 10px;
            overflow: hidden;
        }

        table th {
            background: #0d6efd;
            color: white;
            padding: 10px;
            text-align: center;
        }

        table td {
            padding: 10px;
            text-align: center;
            background: #f8f9fa;
        }

        table tr:nth-child(even) td {
            background: #e9ecef;
        }

        table tr:hover td {
            background: #d0e2ff;
            transition: 0.3s;
        }

        select {
            width: 100%;
            margin-bottom: 15px;
        }

        .container {
            max-width: 700px;
        }

        .card {
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
    </style>
</head>

<body>

    <div class="container mt-5">

        <div class="card p-4">
            <h4 class="mb-3 text-primary text-center">Add Product</h4>

            <form action="{%url 'addproduct' %}" method="post">
                {% csrf_token %}

                <label>Category</label>
                <select name="category">
                    <option value="0">---Select Category---</option>
                    {% for i in categories %}
                    <option value="{{i.id}}">{{i.name}}</option>
                    {% endfor %}
                </select>

                <div class="mb-3">
                    <label>Product Name</label>
                    <input type="text" name="name" class="form-control" placeholder="Enter product name">
                </div>

                <div class="mb-3">
                    <label>Price</label>
                    <input type="text" name="price" class="form-control" placeholder="Enter product price">
                </div>

                <div class="mb-3">
                    <label>Quantity</label>
                    <input type="text" name="qty" class="form-control" placeholder="Enter product qty">
                </div>

                <input type="submit" class="btn btn-primary w-100" value="Add Product">
            </form>

            <!-- Table -->
            <table>
                <tr>
                    <th>Id</th>
                    <th>Name</th>
                    <th>Price</th>
                    <th>Qty</th>
                    <th>Category</th>
                    <th>Total</th>
                    <th colspan="2">Action</th>
                </tr>

                {% for i in product %}
                <tr>
                    <td>{{i.id}}</td>
                    <td>{{i.name}}</td>
                    <td>{{i.price}}</td>
                    <td>{{i.qty}}</td>
                    <td>{{i.category.name}}</td>
                    <td>{{i.total}}</td>
                    <td><a href="{%url 'update' %}?uid{{i.id}}">Update</a></td>
                    <td><a href="#">Delete</a></td>
                </tr>
                {% endfor %}
            </table>

        </div>

    </div>

</body>

</html>
