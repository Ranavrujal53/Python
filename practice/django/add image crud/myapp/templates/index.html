<!DOCTYPE html>
<html>
<head>
    <title>Coffee Form</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1d2671, #c33764);
            min-height: 100vh;
            padding: 40px;
            color: #fff;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            font-weight: 600;
        }

        /* FORM CARD */
        form {
            max-width: 400px;
            margin: auto;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        label {
            font-size: 14px;
            font-weight: 500;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            margin-bottom: 15px;
            border: none;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }

        input:focus, select:focus {
            box-shadow: 0 0 5px #00f2fe;
        }

        button {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            border: none;
            border-radius: 8px;
            color: #000;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, #4facfe, #00f2fe);
        }

        /* TABLE */
        table {
            width: 90%;
            margin: 40px auto;
            border-collapse: collapse;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(8px);
            border-radius: 10px;
            overflow: hidden;
        }

        th, td {
            padding: 12px;
            text-align: center;
        }

        th {
            background: rgba(0,0,0,0.3);
            font-weight: 600;
        }

        tr:nth-child(even) {
            background: rgba(255,255,255,0.05);
        }

        tr:hover {
            background: rgba(255,255,255,0.15);
            transition: 0.3s;
        }

        /* BUTTON LINKS */
        a {
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
        }

        a[href*="update"] {
            background: #00c6ff;
            color: #000;
        }

        a[href*="delete"] {
            background: #ff4b5c;
            color: #fff;
        }

        a:hover {
            opacity: 0.8;
        }

        /* MESSAGE */
        form p {
            background: #00ffcc;
            color: #000;
            padding: 8px;
            border-radius: 5px;
            margin-bottom: 10px;
            text-align: center;
        }

        hr {
            margin: 20px 0;
            border: none;
        }

    </style>
</head>
<body>

<h2>☕ Coffee Management</h2>

<form method="post" enctype="multipart/form-data">
    {% for message in messages %}
        <p>{{message}}</p>
    {% endfor %}

    {% csrf_token %}

    <input type="hidden" name="id" value="{{coff.id}}">

    <label>Coffee Name:</label>
    <input type="text" name="name" value="{{coff.name}}">

    <label>Price:</label>
    <input type="number" name="price" value="{{coff.price}}">

    <label>Category:</label>
    <select name="category">
        <option value="Hot" {% if coff.category == "Hot" %}selected{% endif %}>Hot</option>
        <option value="Cold" {% if coff.category == "Cold" %}selected{% endif %}>Cold</option>
    </select>

    {%if i%}
    <img src="media/{{i.image}}" alt="" height="100px" width="100px">
    {%endif%}
    <label for="image">Image</label>
    <input type="file" name="file" >

    <button type="submit">Save Coffee</button>
</form>

<table>
    <tr>
        <th>ID</th>
        <th>NO. ID</th>
        <th>Name</th>
        <th>Price</th>
        <th>Category</th>
        <th>Image</th>
        <th colspan="2">Action</th>
    </tr>

    {% for i in coffee %}
    <tr>
        <td>{{forloop.counter}}</td>
        <td>{{i.id}}</td>
        <td>{{i.name}}</td>
        <td>{{i.price}}</td>
        <td>{{i.category}}</td>
        <td><img src="media/{{i.image}}" alt="" height="100px" width="100px"></td>
        <td>
            <a href="{% url 'update' %}?uid={{i.id}}">Update</a>
        </td>
        <td>
            <a href="{% url 'delete' %}?did={{i.id}}"
               onclick="return confirm('Are you sure you want to delete this data?')">
               Delete
            </a>
        </td>
    </tr>
    {% endfor %}
</table>

</body>
</html>
