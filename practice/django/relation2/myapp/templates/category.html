<!DOCTYPE html>
<html>
<head>
    <title>Add Category</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-white">

<div class="container mt-5">

    <div class="card p-4">
        <h4 class="text-primary">Add Category</h4>

        <form method="post">
            {% csrf_token %}
            <input type="text" name="name" class="form-control mb-3" placeholder="Category Name" required>
            <button class="btn btn-primary w-100">Add Category</button>
        </form>

        <hr>

        <h5>All Categories</h5>
        <ul>
            {% for i in categories %}
                <li>{{i.name}}</li>
            {% endfor %}
        </ul>

        <a href="{% url 'index' %}" class="btn btn-success mt-3">
            Back to Product Page
        </a>
    </div>

</div>

</body>
</html>
