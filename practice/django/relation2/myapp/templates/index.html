<!DOCTYPE html>
<html lang="en">
<head>
    <title>Product Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-white">

<div class="container mt-5">

    <div class="card p-4">
        <h4 class="text-primary text-center">Add Product</h4>

        <!-- ADD CATEGORY BUTTON -->
        <a href="{% url 'addcategory' %}" class="btn btn-success mb-3">
            + Add Category
        </a>

        <form action="{% url 'addproduct' %}" method="post">
            {% csrf_token %}

            <label>Category</label>
            <select name="category" class="form-control mb-3" required>
                <option value="" disabled selected>Select Category</option>
                {% for i in categories %}
                <option value="{{i.id}}">{{i.name}}</option>
                {% endfor %}
            </select>

            <input type="text" name="name" class="form-control mb-3" placeholder="Product Name" required>
            <input type="number" name="price" class="form-control mb-3" placeholder="Price" required>
            <input type="number" name="qty" class="form-control mb-3" placeholder="Quantity" required>

            <input type="submit" class="btn btn-primary w-100" value="Add Product">
        </form>

        <!-- TABLE -->
        <table class="table table-bordered table-hover text-center mt-4">
            <tr>
                <th>Id</th>
                <th>Name</th>
                <th>Price</th>
                <th>Qty</th>
                <th>Category</th>
                <th>Total</th>
            </tr>

            {% if product %}
                {% for i in product %}
                <tr>
                    <td>{{i.id}}</td>
                    <td>{{i.name}}</td>
                    <td>{{i.price}}</td>
                    <td>{{i.qty}}</td>
                    <td>{{i.category.name}}</td>
                    <td>{{i.total}}</td>
                </tr>
                {% endfor %}
            {% else %}
                <tr>
                    <td colspan="6">No Data Found</td>
                </tr>
            {% endif %}
        </table>

    </div>

</div>

</body>
</html>
