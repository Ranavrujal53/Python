<!DOCTYPE html>
<html>
<head>
    <title>Multi Form System</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            padding: 20px;
        }

        h2 {
            color: green;
        }

        form {
            background: white;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        input {
            margin: 5px;
            padding: 8px;
        }

        button {
            padding: 8px 15px;
            background: black;
            color: white;
            border: none;
            cursor: pointer;
        }

        table {
            background: white;
            border-collapse: collapse;
            width: 100%;
        }

        table, th, td {
            border: 1px solid black;
            padding: 10px;
        }
    </style>
</head>
<body>

<h2>{{ msg }}</h2>

<!-- ================= REGISTER ================= -->
<h3>Registration</h3>
<form method="POST">
    {% csrf_token %}
    <input type="text" name="name" placeholder="Name" required>
    <input type="email" name="email" placeholder="Email" required>
    <input type="password" name="password" placeholder="Password" required>
    <button type="submit" name="register">Register</button>
</form>

<!-- ================= LOGIN ================= -->
<h3>Login</h3>
<form method="POST">
    {% csrf_token %}
    <input type="email" name="email" placeholder="Email" required>
    <input type="password" name="password" placeholder="Password" required>
    <button type="submit" name="login">Login</button>
</form>

<!-- ================= ORDER ================= -->
<h3>Place Order</h3>
<form method="POST">
    {% csrf_token %}
    <input type="text" name="product" placeholder="Product Name" required>
    <input type="number" name="quantity" placeholder="Quantity" required>
    <button type="submit" name="order">Order</button>
</form>

<!-- ================= USERS ================= -->
<h3>Registered Users</h3>
<table>
<tr>
    <th>Name</th>
    <th>Email</th>
</tr>

{% for u in users %}
<tr>
    <td>{{ u.name }}</td>
    <td>{{ u.email }}</td>
</tr>
{% endfor %}
</table>

<br>

<!-- ================= ORDERS ================= -->
<h3>Orders</h3>
<table>
<tr>
    <th>Product</th>
    <th>Quantity</th>
</tr>

{% for o in orders %}
<tr>
    <td>{{ o.product }}</td>
    <td>{{ o.quantity }}</td>
</tr>
{% endfor %}
</table>

</body>
</html>
