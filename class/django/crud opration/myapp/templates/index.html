<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee CRUD</title>

    <!-- ✅ Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body {
            background-color: #f5f7fa;
        }
        .container-box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="container-box">

        <h2 class="text-center mb-4">Employee Management</h2>

        <!-- ✅ Message -->
        {% if msg %}
            <div class="alert alert-success">{{msg}}</div>
        {% endif %}

        <!-- ✅ Form -->
        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" name="name" class="form-control" placeholder="Enter name" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" placeholder="Enter email" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Department</label>
                <input type="text" name="dept" class="form-control" placeholder="Enter department" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">Add Employee</button>
        </form>

        <hr>

        <!-- ✅ Table -->
        <table class="table table-bordered table-hover mt-4 text-center">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Department</th>
                    <th>Delete</th>
                    <th>Update</th>
                </tr>
            </thead>

            <tbody>
                {% for i in emp %}
                <tr>
                    <td>{{i.id}}</td>
                    <td>{{i.name}}</td>
                    <td>{{i.email}}</td>
                    <td>{{i.dept}}</td>

                    <!-- ✅ Delete with confirmation -->
                    <td>
                        <a href="{% url 'delete' %}?dele={{i.id}}"
                           class="btn btn-danger btn-sm "
                           onclick="return confirmDelete();">
                            <i class="fa fa-trash"></i>
                        </a>
                    </td>

                    <td>
                        <a href="{% url 'update' i.id %}" class="btn btn-warning btn-sm">Update</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

    </div>
</div>

<!-- ✅ Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- ✅ Custom JS -->
<script>
    function confirmDelete() {
        return confirm("Are you sure you want to delete this record?");
    }
</script>

</body>
</html>
