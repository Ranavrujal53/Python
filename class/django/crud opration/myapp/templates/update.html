<!DOCTYPE html>
<html lang="en">
<head>
    <title>Update Employee</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <div class="card p-4 shadow">

        <h3 class="text-center mb-4">Update Employee</h3>

        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label>Name</label>
                <input type="text" name="name" value="{{emp.name}}" class="form-control">
            </div>

            <div class="mb-3">
                <label>Email</label>
                <input type="email" name="email" value="{{emp.email}}" class="form-control">
            </div>

            <div class="mb-3">
                <label>Department</label>
                <input type="text" name="dept" value="{{emp.dept}}" class="form-control">
            </div>

            <button class="btn btn-success w-100">Update</button>
        </form>

    </div>
</div>

</body>
</html>
