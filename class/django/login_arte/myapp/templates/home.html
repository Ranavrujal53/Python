<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <style>
        body {
            background: linear-gradient(135deg, #1a2328, #2b3a42);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
            color: white;
        }

        .card-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 350px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 20px;
        }

        .btn-danger {
            width: 100%;
            border-radius: 25px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-danger:hover {
            transform: scale(1.05);
            background-color: #ff4d4d;
        }

        .welcome-text {
            color: #00d4ff;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="card-box">
        <h1>Welcome, <span class="welcome-text">{{ user }}</span></h1>

        <a href="{% url 'logout' %}" class="btn btn-danger mt-3">
            Logout
        </a>
    </div>

</body>

</html>
