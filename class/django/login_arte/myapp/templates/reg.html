<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #1a2328, #2b3a42);
            font-family: 'Segoe UI', sans-serif;
        }

        .register-card {
            border-radius: 20px;
            background: #ffffff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 30px;
        }

        .form-control {
            border-radius: 10px;
        }

        .btn-custom {
            background: #2b3a42;
            color: white;
            border-radius: 10px;
            transition: 0.3s;
        }

        .btn-custom:hover {
            background: #1a2328;
        }

        .title {
            font-weight: bold;
            color: #2b3a42;
        }
    </style>
</head>
<body>

<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="col-md-5">
        <div class="register-card">

            <h2 class="text-center title mb-4">Create Account</h2>
            <span class="text-danger">{{err}}</span>
            <span class="text-success">{{msg}}</span>
            <form method="POST">
                <!-- Django CSRF -->
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="name" class="form-control" placeholder="Enter your name" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-control" placeholder="Enter username" name="uname">
                </div>

                <div class="mb-3">
                    <label class="form-label">Email address</label>
                    <input type="email" name="email" class="form-control" placeholder="Enter email" required>
                </div>


                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                </div>


                <button type="submit" class="btn btn-custom w-100">Register</button>

                <p class="text-center mt-3">
                    <div class="d-grid">
                    <a href="{%url 'loginpage'%}" class="btn btn-success">Already Registered? Login here</a>
                </div>
                </p>
            </form>

        </div>
    </div>
</div>

</body>
</html>
