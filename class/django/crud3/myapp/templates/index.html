<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student</title>
</head>
<body>
    {%for message in messages%}
    {{message}}
    {% endfor %}
    <h1>Student from</h1>
    <form action="" method="post">
    {% csrf_token %}
    <input type="hidden" name="id" value="{{stud.id}}">
    <label for="name">Name</label>
    <input type="text" name="name" placeholder="Enter the name" value="{{stud.name}}"><br><br>

    <label for="email">Email</label>
    <input type="email" name="email" placeholder="Enter the email" value="{{stud.email}}"><br><br>

    <label for="age">Age</label>
    <input type="number" name="age" placeholder="Enter the age" value="{{stud.age}}"><br><br>

    <input type="submit"><br><br>
    </form>

    <hr>
    <hr>

    <table border="2" cellspacing="10" cellpadding="10">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Age</th>
            <th>Action</th>
            
        </tr>

        {% for i in std %}
        <tr>
            <td>{{i.id}}</td>
            <td>{{i.name}}</td>
            <td>{{i.email}}</td>
            <td>{{i.age}}</td>
            <td><a href="{%url 'delete'%}?dele={{i.id}}">Delete</a></td>
            <td><a href="{%url 'update'%}?uid={{i.id}}">Update</a></td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
