<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Premium Homepage</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

body{
font-family:'Poppins',sans-serif;
background:linear-gradient(135deg,#141E30,#243B55);
color:white;
}

/* NAVBAR */

.navbar{
background:rgba(255,255,255,0.08);
backdrop-filter:blur(10px);
}

.navbar-brand{
font-weight:700;
letter-spacing:2px;
}

/* HERO SECTION */

.hero{
height:90vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
}

.hero h1{
font-size:65px;
font-weight:700;
animation:slideUp 1.5s ease;
}

.hero p{
font-size:20px;
opacity:0.9;
}

/* BUTTON */

.btn-main{
background:#ff7b00;
border:none;
padding:12px 30px;
border-radius:30px;
font-weight:600;
transition:0.3s;
}

.btn-main:hover{
transform:scale(1.1);
box-shadow:0 10px 25px rgba(0,0,0,0.4);
}

/* FEATURES */

.card{
background:rgba(255,255,255,0.08);
border:none;
border-radius:20px;
backdrop-filter:blur(10px);
transition:0.4s;
}

.card:hover{
transform:translateY(-10px);
box-shadow:0 20px 40px rgba(0,0,0,0.4);
}

/* ANIMATION */

@keyframes slideUp{

from{
opacity:0;
transform:translateY(40px);
}

to{
opacity:1;
transform:translateY(0);
}

}

</style>

</head>

<body>

<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg navbar-dark">

<div class="container">

<a class="navbar-brand" href="#">MySite</a>

<button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
<span class="navbar-toggler-icon"></span>
</button>

<div class="collapse navbar-collapse" id="menu">

<ul class="navbar-nav ms-auto">

<li class="nav-item">
<a class="nav-link" href="#">Home</a>
</li>

<li class="nav-item">
<a class="nav-link" href="/about/">About</a>
</li>

<li class="nav-item">
<a class="nav-link" href="#">Services</a>
</li>

<li class="nav-item">
<a class="nav-link" href="/contect/">Contact</a>
</li>

<li class="nav-item">
<a class="btn btn-main ms-3">Login</a>
</li>

</ul>

</div>

</div>

</nav>

<!-- HERO SECTION -->

<section class="hero">

<div class="container">

<h1>Build Amazing Websites</h1>

<p class="mt-3">
Modern Django Homepage with Beautiful UI
</p>

<a class="btn btn-main mt-4">Get Started</a>

</div>

</section>

<!-- FEATURES -->

<div class="container mb-5">

<div class="row g-4">

<div class="col-md-4">

<div class="card p-4 text-center">

<h4>Fast</h4>

<p>Powered by Django and Bootstrap</p>

</div>

</div>

<div class="col-md-4">

<div class="card p-4 text-center">

<h4>Modern</h4>

<p>Beautiful UI with animation</p>

</div>

</div>

<div class="col-md-4">

<div class="card p-4 text-center">

<h4>Responsive</h4>

<p>Works perfectly on mobile</p>

</div>

</div>

</div>

</div>

<!-- FOOTER -->

<footer class="text-center p-4">

<p>© 2026 My Website</p>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
