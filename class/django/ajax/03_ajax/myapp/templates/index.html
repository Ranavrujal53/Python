<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Modern CRUD UI</title>

    <script src="https://code.jquery.com/jquery-4.0.0.js" integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1d2b64, #f8cdda);
            min-height: 100vh;
        }

        .container {
            margin-top: 50px;
        }

        /* Glass Effect Card */
        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
            color: white;
        }

        h3 {
            font-weight: 600;
            letter-spacing: 1px;
        }

        /* Labels */
        .form-label {
            color: #fff;
            font-weight: 500;
            margin-bottom: 5px;
        }

        /* Inputs */
        .form-control {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            border-radius: 10px;
        }

        .form-control::placeholder {
            color: #eee;
        }

        .form-control:focus {
            box-shadow: 0 0 10px #fff;
            background: rgba(255,255,255,0.25);
            color: white;
        }

        /* Buttons */
        .btn-custom {
            border-radius: 12px;
            padding: 10px 15px;
            font-weight: 500;
            transition: 0.3s;
        }

        .btn-add {
            background: linear-gradient(45deg, #00c6ff, #0072ff);
            border: none;
        }

        .btn-update {
            background: linear-gradient(45deg, #11998e, #38ef7d);
            border: none;
        }

        .btn-edit {
            background: linear-gradient(45deg, #f7971e, #ffd200);
            border: none;
            color: black;
        }

        .btn-delete {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            border: none;
        }

        .btn-custom:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255,255,255,0.5);
        }

        /* Table */
        table {
            border-radius: 15px;
            overflow: hidden;
        }

        thead {
            background: rgba(0,0,0,0.7);
        }

        thead th {
            color: #fff;
            text-transform: uppercase;
        }

        tbody tr {
            background: rgba(255,255,255,0.1);
            transition: 0.3s;
        }

        tbody tr:hover {
            background: rgba(255,255,255,0.25);
            transform: scale(1.01);
        }

        tbody td {
            color: white;
        }

        /* Search */
        .search-box input {
            border-radius: 12px;
            border: none;
            background: rgba(255,255,255,0.2);
            color: white;
        }

        .search-box input::placeholder {
            color: #ddd;
        }

    </style>
    <script>
        $(document).ready(function(){
            load()
            $("#ubtn").hide()
        })

        const load = () => {
            $.get("display", {}, function(rt){
                rows = ""
                rt.student.map(ele => {
                    rows += `<tr>
                        <td>${ele.id}</td>
                        <td>${ele.name}</td>
                        <td>${ele.email}</td>
                        <td>${ele.age}</td>

                        <td>
                            <button onclick="edituser(${ele.id})">Edit</button>
                            <button onclick="deleteuser(${ele.id})">Delete</button>
                        </td>
                        </tr>`
                })
                $("#tdata").html(rows)
            }) 
        }

        const adduser = () => {
            var name = $("#name").val()
            var email = $("#email").val()
            var age = $("#age").val()
            var csrfmiddleewaretoken = $('input[name="csrfmiddleewaretoken "]').val()

            $.post("adduser", {csrfmiddleewaretoken , name, email, age }, function(rt){
                alert(rt)
                load()

                $("#name").val()
                $('#email').val()
                &("#age").val()
            })
        }

    </script>
</head>

<body>

<div class="container">

    <!-- Form -->
    <div class="card p-4 mb-4">
        <h3 class="text-center mb-4">User Form</h3>

        <form method="post">
            <div class="row g-4">
            {% csrf_token %}
                <!-- Name -->
                <div class="col-md-4">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-control" placeholder="Enter your name">
                </div>

                <!-- Email -->
                <div class="col-md-4">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-control" placeholder="Enter your email">
                </div>

                <!-- Age -->
                <div class="col-md-4">
                    <label class="form-label">Age</label>
                    <input type="number" class="form-control" placeholder="Enter age">
                </div>

                <!-- Buttons -->
                <div class="col-12 d-flex gap-3 mt-3">
                    <button type="button" class="btn btn-custom btn-add w-50">Add User</button>
                    <button type="button" class="btn btn-custom btn-update w-50">Update User</button>
                </div>

            </div>
        </form>
    </div>

    <!-- Table -->
    <div class="card p-4">
        <h3 class="text-center mb-4">User Data</h3>

        <div class="search-box mb-3">
            <input type="text" class="form-control" placeholder="Search...">
        </div>

        <div class="table-responsive">
            <table class="table text-center align-middle">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Age</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="tdata">
            </table>
        </div>

    </div>

</div>

</body>
